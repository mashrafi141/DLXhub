name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          check-latest: true

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # =========================
      # BUILD DEBUG APK
      # =========================

      - name: Prepare Gradle Wrapper
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          ./gradlew --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace

      - name: Verify debug APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DLXhub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # =========================
      # BUILD RELEASE APK
      # =========================

      - name: Build release APK
        run: |
          ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease --stacktrace

      - name: Verify release APK exists
        run: |
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: DLXhub-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # =========================
      # AUTO GITHUB RELEASE
      # =========================

      - name: Create automatic GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "DLXhub Build ${{ github.run_number }}"
          body: |
            Automatic DLXhub APK Release

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Build: #${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
